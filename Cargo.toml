[workspace]
resolver = "2"
members = [
  "crates/hampp-envelope",
  "crates/hampp-core",
  "crates/hampp-session",
  "crates/hampp-cli",
  "crates/hampp-sim",
  "crates/hampp-py",
]
default-members = [
  "crates/hampp-envelope",
  "crates/hampp-core",
  "crates/hampp-session",
  "crates/hampp-cli",
  "crates/hampp-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
hampp-envelope = { path = "crates/hampp-envelope" }
hampp-core = { path = "crates/hampp-core" }
hampp-session = { path = "crates/hampp-session" }
hampp-sim = { path = "crates/hampp-sim" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.12", default-features = false }
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
