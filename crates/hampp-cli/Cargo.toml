[package]
name = "hampp-cli"
description = "hampp command line tool: keygen, sign, verify, inspect, strip, annotate, registry, handshake, probe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hampp"
path = "src/main.rs"

[dependencies]
hampp-core = { workspace = true }
hampp-envelope = { workspace = true }
hampp-session = { workspace = true }
hampp-tpm = { workspace = true, optional = true }
clap = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# TPM-backed keys (protection bound); needs libtss2 to build.
tpm = ["dep:hampp-tpm"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
