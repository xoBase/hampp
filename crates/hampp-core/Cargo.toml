[package]
name = "hampp-core"
description = "HAMPP core: identity, signatures, envelope header, verdicts, registry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hampp-envelope = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
p256 = { workspace = true }
rand_core = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# Test code only: lets a software key claim a higher protection level (see `P256Software`).
test-support = []

[dev-dependencies]
# Self dev-dependency: turns the feature on for this crate's own tests, never for dependents.
hampp-core = { path = ".", features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }
