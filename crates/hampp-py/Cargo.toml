[package]
name = "hampp-py"
description = "Python bindings for HAMPP"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
hampp-core = { workspace = true }
hampp-envelope = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
