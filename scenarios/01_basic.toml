name = "basic two-agent conversation with handshake"
[[agents]]
name = "alice"
[[agents]]
name = "bob"
[[steps]]
from = "alice"
to = "bob"
text = "Der Auftrag wurde erfolgreich ausgeführt."
expect = "authenticated:registered-instance"
[[steps]]
from = "bob"
to = "alice"
text = "Verstanden."
expect = "authenticated:registered-instance"
