name = "suite 2 session: a replayed bound message is rejected"
[[agents]]
name = "alice"
key = "ecdsa-p256"
level = "bound"
[[agents]]
name = "bob"
key = "ecdsa-p256"
level = "bound"
[[steps]]
from = "alice"
to = "bob"
protection = "bound"
text = "Zahle 100 Euro"
