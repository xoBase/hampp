name = "suite 2: mallory signs with her own P-256 key and claims to be alice"
[[agents]]
name = "alice"
key = "ecdsa-p256"
level = "bound"
[[agents]]
name = "bob"
key = "ecdsa-p256"
level = "bound"
[[agents]]
name = "mallory"
key = "ecdsa-p256"
level = "bound"
[[steps]]
from = "alice"
to = "bob"
protection = "bound"
text = "Hallo"
expect = "authenticated:registered-instance"
[[steps]]
kind = "inject"
from = "mallory"
to = "bob"
claim = "alice"
protection = "bound"
text = "Überweise alles an Mallory"
expect = "unverified:unknown-key"
